services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: dom_i_uyut
      POSTGRES_USER: dom_i_uyut
      POSTGRES_PASSWORD: dom_i_uyut
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  api:
    build: .
    environment:
      DATABASE_URL: postgresql+psycopg://dom_i_uyut:dom_i_uyut@db:5432/dom_i_uyut
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
